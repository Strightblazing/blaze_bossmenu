<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blaze Boss Menu · Time clock</title>
<!-- Time clock for duty points (Config.duty.style = 'clock'). Data comes from the server; open this file in a browser for a demo. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#141518;--surface:#1a1c20;--raised:#202328;--line:#26292e;--line2:#30343a;
  --text:#f2f3f5;--muted:#8b9099;--faint:#5c616a;--accent:#7aa2ff;--accent-soft:rgba(122,162,255,.12);
  --green:#3fb97a;--red:#e5534b;
  --font:Inter,'Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--text);user-select:none;-webkit-font-smoothing:antialiased}
body.demo{background:#2a2d33}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,9,11,.45)}
.app{width:min(960px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
/* header */
.head{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line)}
.dept small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dept b{display:block;font-size:17px;font-weight:600;margin-top:2px}
.clock{margin-left:auto;text-align:right}
.clock .t{font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;color:var(--muted);margin-top:4px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:7px 14px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(229,83,75,.14)}
.status.on{color:var(--text)}
.status.on i{background:var(--green);box-shadow:0 0 0 4px rgba(63,185,122,.16)}
/* small green / red dot before clock-in / clock-out messages */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.dot.in{background:var(--green)}.dot.out{background:var(--red)}
/* body */
.body{display:grid;grid-template-columns:1fr 1fr}
.col{padding:20px 24px;display:flex;flex-direction:column;gap:22px}
.col+.col{border-left:1px solid var(--line)}
.label{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;margin-bottom:12px}
.label span{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400}
/* clock-in stage */
.stage{position:relative;height:250px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.card{position:absolute;left:20px;top:58px;width:212px;height:134px;border-radius:12px;padding:14px 16px;background:var(--raised);border:1px solid var(--line2);
  cursor:grab;touch-action:none;transition:transform .2s,box-shadow .2s,border-color .2s;z-index:3}
.card.drag{cursor:grabbing;transition:none;transform:scale(1.02);box-shadow:0 16px 36px rgba(0,0,0,.45);border-color:#3a3f47}
.card .top{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card .virt{font-size:10px;letter-spacing:.08em;color:var(--faint)}
.card .who{display:flex;gap:12px;align-items:center;margin-top:16px}
.av{width:40px;height:40px;border-radius:50%;background:#2a2e35;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.card .nm{font-size:15px;font-weight:600}
.card .rk{font-size:12.5px;color:var(--muted);margin-top:1px}
.card .ids{position:absolute;left:16px;right:16px;bottom:12px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
.card .strip{display:none;position:absolute;left:0;right:0;bottom:34px;height:10px;background:#111215}
.swipe .card .strip{display:block}
.reader{position:absolute;display:none}
.tap .reader.pad{display:flex;right:22px;top:50px;width:150px;height:150px;border-radius:50%;border:1px solid var(--line2);align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--faint);font-size:12px;transition:border-color .2s,color .2s,background .2s}
.pad .ring{width:46px;height:46px;border-radius:50%;border:1.5px solid currentColor;position:relative}
.pad .ring:after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid currentColor;opacity:.4}
.pad.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pad.read .ring{animation:ping .6s ease-out}@keyframes ping{50%{box-shadow:0 0 0 12px var(--accent-soft)}}
.swipe .reader.slot{display:block;left:20px;right:20px;bottom:24px;height:44px;border-radius:10px;border:1px solid var(--line2);background:#121316}
.slot .line{position:absolute;left:14px;right:14px;top:21px;height:2px;border-radius:1px;background:var(--line2)}
.slot .fill{position:absolute;left:14px;top:21px;height:2px;border-radius:1px;background:var(--accent);width:0;transition:width .15s}
.slot .cap{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:11.5px;color:var(--faint)}
.swipe .card{top:28px}
.keypad .card{left:16px;top:56px;transform:scale(.86);transform-origin:left top;cursor:default}
.keypad .reader.keys{display:grid;right:16px;top:16px;width:188px;grid-template-columns:repeat(3,1fr);gap:6px}
.keys .disp{grid-column:1/-1;height:38px;border-radius:8px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:18px;letter-spacing:.6em;color:var(--text);padding-left:.6em}
.keys button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--text);font-family:var(--font);font-size:15px;font-weight:500;cursor:pointer}
.keys button:hover{border-color:var(--line2)}
.keys button:active{background:#262a30}
.keys button.go{background:var(--accent);border-color:var(--accent);color:#0c1220;font-size:13px;font-weight:600}
.keys button.clr{font-size:12px;color:var(--muted)}
.msg{position:absolute;left:20px;top:18px;font-size:13px;color:var(--muted);transition:color .2s}
.msg b{color:var(--text);font-weight:500}
.msg.ok{color:var(--text)}
.msg.err{color:var(--text);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.keypad .msg{display:none}
.result{margin-top:12px;font-size:13px;color:var(--muted);min-height:20px}
.result b{color:var(--text);font-weight:500}
.announce{font-size:14px;line-height:1.55;color:#d6d8dc}
.announce small{display:block;margin-top:6px;font-size:12px;color:var(--faint)}
/* right column */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--panel);padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat b.live{color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:92px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{width:100%;max-width:22px;border-radius:4px;background:#2b2f36;min-height:2px;transition:height .5s}
.bar.today i{background:var(--accent)}
.bar span{font-size:11px;color:var(--faint)}.bar.today span{color:var(--text)}
.bar em{font-style:normal;font-size:10.5px;color:var(--muted);min-height:13px}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .5s}
.sub{font-size:13px;color:var(--muted)}
.sub b{color:var(--text);font-weight:500}
.people{display:flex;flex-direction:column}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.person:first-child{border-top:0;padding-top:0}
.person .av{width:28px;height:28px;font-size:11px}
.person .rk{margin-left:auto;color:var(--muted);font-size:12.5px}
.person.you .av{background:var(--green);color:#0b1a12}
/* footer */
.foot{display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.foot .sp{flex:1}
.btn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:8px;padding:8px 16px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface)}
/* demo controls */
.demobar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:none;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:4px;font-size:12.5px;z-index:50}
.demo .demobar{display:flex}
.demobar span{color:var(--faint);padding:0 8px}
.demobar button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 12px;font-family:var(--font);font-size:12.5px;font-weight:500;cursor:pointer}
.demobar button.on{background:var(--raised);color:var(--text)}
@media (max-width:860px){.body{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}}
/* tap / swipe / PIN switcher */
.seg{display:flex;gap:2px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;text-transform:none;letter-spacing:0}
.seg button.on{background:var(--raised);color:var(--text)}
.game #wrap{display:none}.game #wrap.show{display:flex}
.empty{font-size:13px;color:var(--faint)}
/* minigame only: until they clock in/out, show just the clock-in area */
.app{transition:width .35s cubic-bezier(.2,.8,.2,1)}
.app.mini{width:min(540px,94vw)}
.app.mini .body{grid-template-columns:1fr}
.app.mini .col.info,.app.mini .announce-block,.app.mini #footNote{display:none}
.app.mini .clock .t{font-size:26px}
.app .col.info,.app .announce-block{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- compact: the full view sits in the middle, it doesn't fill the screen ---------- */
#wrap{background:rgba(8,9,11,.22)}
.app{width:min(780px,94vw);border-radius:14px}
.head{padding:14px 18px;gap:12px}
.dept b{font-size:15px}
.clock .t{font-size:26px}.clock .d{font-size:11px;margin-top:3px}
.status{padding:5px 11px;font-size:12px}
.col{padding:14px 18px;gap:14px}
.label{margin-bottom:8px;font-size:10.5px}
.stage{height:200px;border-radius:10px}
.card{top:46px;width:196px;height:122px;padding:12px 14px}
.card .who{margin-top:12px}.card .nm{font-size:14px}.card .rk{font-size:12px}
.av{width:34px;height:34px;font-size:12px}
.tap .reader.pad{top:38px;width:132px;height:132px}
.keypad .card{top:44px;transform:scale(.8)}
.keypad .reader.keys{top:12px;width:176px;gap:5px}
.keys .disp{height:32px;font-size:16px}.keys button{height:32px;font-size:14px}
.swipe .card{top:22px}.swipe .reader.slot{bottom:18px;height:38px}.slot .line,.slot .fill{top:18px}
.msg{top:14px;left:16px;font-size:12.5px}
.result{margin-top:8px;font-size:12.5px;min-height:18px}
.announce{font-size:13px}
.stat{padding:9px 12px}.stat small{font-size:11px}.stat b{font-size:18px;margin-top:2px}
.tags{margin-top:8px}.tag{font-size:11px;padding:2px 9px}
.week{height:70px;gap:8px}.bar em{font-size:10px}.bar span{font-size:10.5px}
.prog{margin:2px 0 8px}.sub{font-size:12px}
.person{padding:6px 0;font-size:12.5px}.person .av{width:24px;height:24px;font-size:10px}.person .rk{font-size:11.5px}
.people{max-height:150px;overflow-y:auto}
.foot{padding:10px 18px;font-size:12px}
.btn{padding:6px 14px;font-size:12.5px}
.app.mini{width:min(470px,94vw)}

/* size: the whole clock is scaled (about 25% larger; smaller on small screens) */
.scaler{transform:scale(var(--ui-scale,1.25));transform-origin:center;transition:transform .2s}

/* ---------- motion & glow (subtle) ---------- */
@media (prefers-reduced-motion:no-preference){
/* panel opens */
#wrap.show .app{animation:appIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes appIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
/* status: on-duty dot breathes */
.status.on i{animation:dotPulse 2.4s ease-in-out infinite}
@keyframes dotPulse{50%{box-shadow:0 0 0 7px rgba(63,185,122,.05),0 0 12px rgba(63,185,122,.5)}}
/* shift timer colon blink + soft glow */
.stat b.live{text-shadow:0 0 18px rgba(122,162,255,.35)}
/* the ID: lift on hover, sheen on pick-up */
.card{overflow:hidden}
.card:hover:not(.drag){transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card:after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-12deg);pointer-events:none}
.card.drag:after{animation:sheen .7s ease-out}
@keyframes sheen{to{left:130%}}
/* reader: idle breathing, glow when the ID is over it, green ripple on success */
.pad .ring{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 14px rgba(122,162,255,.18)}}
.pad.hot{box-shadow:0 0 0 1px rgba(122,162,255,.25),0 0 34px rgba(122,162,255,.22)}
.pad.hot .ring{animation:none;box-shadow:0 0 18px rgba(122,162,255,.55)}
.pad.read{border-color:var(--green);color:var(--green);background:rgba(63,185,122,.08)}
.pad.read .ring{animation:ripple .7s ease-out}
@keyframes ripple{from{box-shadow:0 0 0 0 rgba(63,185,122,.5)}to{box-shadow:0 0 0 30px rgba(63,185,122,0)}}
/* swipe: glowing trail */
.slot .fill{box-shadow:0 0 10px rgba(122,162,255,.7),0 0 22px rgba(122,162,255,.35)}
/* keypad: press glow, PIN dots pop */
.keys button{transition:transform .08s,background .15s,box-shadow .2s,border-color .2s}
.keys button:hover{box-shadow:0 0 0 1px rgba(122,162,255,.18),0 0 14px rgba(122,162,255,.12)}
.keys button.press{transform:scale(.94);background:#262a30;box-shadow:0 0 0 1px rgba(122,162,255,.4),0 0 18px rgba(122,162,255,.3)}
.keys button.go:hover{box-shadow:0 0 18px rgba(122,162,255,.45)}
.keys button.go.press{background:var(--accent);box-shadow:0 0 22px rgba(122,162,255,.6)}
.keys .disp{transition:box-shadow .2s,border-color .2s}
.keys .disp.typing{border-color:rgba(122,162,255,.45);box-shadow:0 0 16px rgba(122,162,255,.18)}
.keys .disp .d{display:inline-block;width:.6em;text-align:center}
.keys .disp .d.on{color:var(--accent);text-shadow:0 0 10px rgba(122,162,255,.8)}
.keys .disp .d.new{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:.4}to{transform:none;opacity:1}}
.keys .disp.bad{border-color:rgba(229,83,75,.6);box-shadow:0 0 18px rgba(229,83,75,.3);animation:shake .35s}
/* whole clock-in area flashes green / red */
.stage{transition:border-color .3s,box-shadow .3s}
.stage.good{border-color:rgba(63,185,122,.55);box-shadow:0 0 0 1px rgba(63,185,122,.2),0 0 30px rgba(63,185,122,.14)}
.stage.bad{border-color:rgba(229,83,75,.55);box-shadow:0 0 0 1px rgba(229,83,75,.2),0 0 30px rgba(229,83,75,.14)}
.dot.in{box-shadow:0 0 8px rgba(63,185,122,.8)}.dot.out{box-shadow:0 0 8px rgba(229,83,75,.8)}
/* full screen reveal: sections one after another */
.app:not(.mini) .col.info>div,.app:not(.mini) .announce-block{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.app:not(.mini) .col.info>div:nth-child(1){animation-delay:.05s}.app:not(.mini) .col.info>div:nth-child(2){animation-delay:.12s}
.app:not(.mini) .col.info>div:nth-child(3){animation-delay:.19s}.app:not(.mini) .col.info>div:nth-child(4){animation-delay:.26s}
.app:not(.mini) .announce-block{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar i{transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bar.today i{box-shadow:0 0 14px rgba(122,162,255,.45)}
.prog i{position:relative;overflow:hidden;transition:width .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(122,162,255,.5)}
.prog i:after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{60%,100%{left:110%}}
.person{animation:rise .35s ease-out both}
.person.you .av{box-shadow:0 0 12px rgba(63,185,122,.55)}
}
</style></head>
<body>
<div class="demobar"><span>Demo</span><button id="flip">Start off duty</button></div>

<div id="wrap"><div class="scaler" id="scaler"><div class="app mini" id="app">
  <div class="head">
    <div class="dept"><small>Time clock</small><b id="dept"></b></div>
    <div class="clock"><div class="t" id="clock"></div><div class="d" id="date"></div></div>
    <div class="status" id="status"><i></i><span>Off duty</span></div>
  </div>

  <div class="body">
    <div class="col">
      <div>
        <div class="label">Clock in <div class="seg" id="seg"></div></div>
        <div class="stage tap" id="stage">
          <div class="msg" id="msg"></div>
          <div class="card" id="card">
            <div class="top"><span id="cardDept"></span><span class="virt" id="virt">Virtual ID</span></div>
            <div class="who"><div class="av" id="ini"></div><div><div class="nm" id="cName"></div><div class="rk" id="cRank"></div></div></div>
            <div class="strip"></div>
            <div class="ids"><span>ID <span id="cId"></span></span><span>PIN <span id="cPin"></span></span></div>
          </div>
          <div class="reader pad" id="pad"><div class="ring"></div><div>Reader</div></div>
          <div class="reader slot" id="slot"><div class="cap">Swipe left to right</div><div class="line"></div><div class="fill" id="fill"></div></div>
          <div class="reader keys" id="keys"></div>
        </div>
        <div class="result" id="result"></div>
      </div>
      <div class="announce-block">
        <div class="label">Announcement</div>
        <div class="announce" id="ann"></div>
      </div>
    </div>

    <div class="col info">
      <div>
        <div class="label">Your shift <span id="shiftNote"></span></div>
        <div class="stats">
          <div class="stat"><small>This shift</small><b id="shift">0:00:00</b></div>
          <div class="stat"><small>This week</small><b id="weekH"></b></div>
          <div class="stat"><small id="monthLabel">Last 31 days</small><b id="monthH"></b></div>
        </div>
        <div class="tags" id="tags"></div>
      </div>
      <div>
        <div class="label">This week <span id="lastShift"></span></div>
        <div class="week" id="week"></div>
      </div>
      <div>
        <div class="label">Next rank <span id="nextRank"></span></div>
        <div class="prog" id="prog"><i id="progBar"></i></div>
        <div class="sub" id="progText"></div>
      </div>
      <div>
        <div class="label">On duty <span id="dutyCount"></span></div>
        <div class="people" id="duty"></div>
      </div>
    </div>
  </div>

  <div class="foot"><span id="footNote"></span><span class="sp"></span><button class="btn" id="close">Close</button></div>
</div></div></div>

<script>
// In game this page runs inside web/index.html, which passes messages to and from the game
const host = window.parent !== window ? window.parent : null;
const isFiveM = !!(host && typeof host.GetParentResourceName === 'function') || typeof GetParentResourceName === 'function';
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = s => String(s || '').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const money = n => '$' + Math.round(n || 0).toLocaleString('en-US');

function post(name, data) {
  if (host && host.postNui) return host.postNui(name, data);
  if (typeof GetParentResourceName === 'function')
    return fetch('https://' + GetParentResourceName() + '/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(data || {}) }).then(r => r.json()).catch(() => ({}));
  return Promise.resolve({});
}

// ---------- size: up to 25% larger, but always fits the screen ----------
const UI_SCALE = 1.25;
let S = UI_SCALE;
function fitScale() {
  const app = $('#app');
  const w = app.offsetWidth || 780, h = app.offsetHeight || 600;
  S = Math.max(0.6, Math.min(UI_SCALE, (innerWidth * 0.94) / w, (innerHeight * 0.92) / h));
  document.documentElement.style.setProperty('--ui-scale', S);
}
addEventListener('resize', fitScale);

// ---------- data: from the server in game, demo values in a browser ----------
let D = {
  dept: 'EMS', name: 'Jane Doe', rank: 'Paramedic', callsign: 'E-14', id: '4B7Q2', pin: '4821', virtual: true,
  onDuty: false, shiftSeconds: 0, weekHours: 14.5, monthHours: 52.0, week: [2.5, 4, 0, 3.3, 4.7, 0, 0], today: 5, keepDays: 31,
  lastShift: '11-13-2026 · 3h 20m',
  next: { rank: 'Senior Paramedic', need: 60, payNow: 500, payNext: 650 },
  tags: ['Employee of the week', 'Probation · 3 days left'],
  onDutyList: [['Dr. Steven Blaze', 'Chief'], ['Mike Kerr', 'EMT'], ['Ana Lopez', 'Paramedic']],
  announcement: { message: 'Training night Thursday 8pm at Pillbox. Bring your trauma kit.', by: 'Dr. Steven Blaze', at: '11-13-2026' },
};
let methods = ['tap', 'swipe', 'keypad'], method = 'tap', clockedAt = null, busy = false;

// ---------- clock ----------
function tick() {
  const t = new Date();
  $('#clock').textContent = pad2(t.getHours()) + ':' + pad2(t.getMinutes());
  $('#date').textContent = t.toLocaleDateString('en-US', { weekday: 'long' }) + ', ' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate()) + '-' + t.getFullYear();
  if (clockedAt) {
    const s = Math.floor((Date.now() - clockedAt) / 1000);
    $('#shift').textContent = Math.floor(s / 3600) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
  }
}
setInterval(tick, 1000);

// ---------- a single soft tone ----------
let ac;
function tone(ok) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = ok ? 880 : 220;
    g.gain.setValueAtTime(.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(.08, ac.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (ok ? .22 : .35));
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .4);
  } catch (e) {}
}

const HINT = { tap: 'Drag your ID onto the reader', swipe: 'Drag your ID through the slot in one quick move', keypad: '' };
const NAME = { tap: 'Tap', swipe: 'Swipe', keypad: 'PIN' };
let msgT;
function msg(text, cls) {
  const el = $('#msg'); el.innerHTML = text; el.className = 'msg ' + (cls || '');
  clearTimeout(msgT); if (cls) msgT = setTimeout(() => { el.innerHTML = HINT[method]; el.className = 'msg'; }, 2600);
}

// ---------- render ----------
function render() {
  $('#dept').textContent = D.dept; $('#cardDept').textContent = D.dept;
  $('#cName').textContent = D.name; $('#cRank').textContent = D.rank + (D.callsign ? ' · ' + D.callsign : '');
  $('#cId').textContent = D.id; $('#cPin').textContent = D.pin; $('#ini').textContent = initials(D.name);
  $('#virt').style.display = D.virtual ? '' : 'none';
  $('#status').className = 'status' + (D.onDuty ? ' on' : ''); $('#status span').textContent = D.onDuty ? 'On duty' : 'Off duty';
  $('#weekH').textContent = (D.weekHours || 0).toFixed(1) + ' h'; $('#monthH').textContent = (D.monthHours || 0).toFixed(1) + ' h';
  $('#monthLabel').textContent = 'Last ' + (D.keepDays || 31) + ' days';
  $('#shift').classList.toggle('live', !!D.onDuty); if (!D.onDuty) $('#shift').textContent = '0:00:00';
  $('#shiftNote').textContent = D.onDuty && clockedAt ? 'Since ' + new Date(clockedAt).toTimeString().slice(0, 5) : 'Not clocked in';
  $('#tags').innerHTML = (D.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
  const week = D.week || [0, 0, 0, 0, 0, 0, 0], max = Math.max(6, ...week);
  $('#week').innerHTML = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d, i) =>
    '<div class="bar' + (i === D.today ? ' today' : '') + '"><em>' + (week[i] >= 0.05 ? week[i].toFixed(1) : '') + '</em><i data-h="' +
    Math.max(2, week[i] / max * 40) + '" style="height:' + Math.max(2, week[i] / max * 40) + 'px"></i><span>' + d + '</span></div>').join('');
  $('#lastShift').textContent = D.lastShift ? 'Last shift ' + D.lastShift : 'No shifts yet';
  const n = D.next;
  if (!n) {
    $('#nextRank').textContent = 'Top rank'; $('#prog').style.display = 'none'; $('#progText').textContent = 'You hold the highest rank.';
  } else {
    $('#nextRank').textContent = n.rank; $('#prog').style.display = n.need ? '' : 'none';
    const pay = n.payNext ? ' · pay ' + money(n.payNow) + ' → ' + money(n.payNext) + ' per paycheck' : '';
    if (n.need) {
      const pct = Math.min(100, (D.monthHours || 0) / n.need * 100);
      $('#progBar').style.width = pct + '%';
      $('#progText').innerHTML = pct >= 100 ? '<b>Ready for promotion.</b> Talk to your manager.' + pay
        : '<b>' + (D.monthHours || 0).toFixed(1) + '</b> of ' + n.need + ' hours in the last ' + (D.keepDays || 31) + ' days' + pay;
    } else $('#progText').innerHTML = 'Promotions are decided by management' + pay;
  }
  const list = (D.onDuty ? [[D.name, D.rank, true]] : []).concat(D.onDutyList || []);
  $('#dutyCount').textContent = list.length;
  $('#duty').innerHTML = list.length ? list.map(p => '<div class="person' + (p[2] ? ' you' : '') + '"><span class="av">' + initials(p[0]) + '</span>' + esc(p[0]) +
    (p[2] ? ' <span style="color:var(--faint)">(you)</span>' : '') + '<span class="rk">' + esc(p[1]) + '</span></div>').join('')
    : '<div class="empty">Nobody is on duty.</div>';
  const a = D.announcement;
  $('#ann').innerHTML = a ? esc(a.message) + '<small>' + esc(a.by || 'Management') + (a.at ? ' · ' + esc(a.at) : '') + '</small>' : '<span class="empty">No announcement.</span>';
  $('#footNote').textContent = D.onDuty ? 'Clock out here when your shift ends.' : 'Hours on duty count toward promotions.';
  $('#flip').textContent = D.onDuty ? 'Start on duty' : 'Start off duty';
}

// ---------- little effects ----------
function flash(cls) { const st = $('#stage'); st.classList.remove('good', 'bad'); void st.offsetWidth; st.classList.add(cls); setTimeout(() => st.classList.remove(cls), 1300); }
function countUp(el, to, suffix) {
  const start = performance.now(), dur = 700;
  const step = t => { const k = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = (to * e).toFixed(1) + suffix; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
/** The full screen opens: hours count up, week bars grow in one by one, progress bar fills */
function reveal() {
  countUp($('#weekH'), D.weekHours || 0, ' h'); countUp($('#monthH'), D.monthHours || 0, ' h');
  const bars = [...document.querySelectorAll('#week i')];
  bars.forEach(b => { b.style.transition = 'none'; b.style.height = '2px'; });
  const bar = $('#progBar'), w = bar.style.width; bar.style.transition = 'none'; bar.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bars.forEach((b, i) => { b.style.transition = ''; b.style.transitionDelay = (0.15 + i * 0.05) + 's'; b.style.height = b.dataset.h + 'px'; });
    bar.style.transition = ''; bar.style.width = w;
  }));
}

// ---------- clock in / out ----------
function done(onDuty, shift) {
  tone(true);
  const now = new Date(), hhmm = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  if (onDuty) {
    // clocked in: open the full screen
    flash('good');
    setTimeout(() => { $('#app').classList.remove('mini'); reveal(); setTimeout(fitScale, 380); }, 700);
    msg('<span class="dot in"></span><b>Clocked in</b> at ' + hhmm, 'ok');
    $('#result').innerHTML = '<span class="dot in"></span><b>Clocked in at ' + hhmm + '.</b> Have a good shift.';
  } else {
    // clocked out: show the result for a moment, then close the clock
    flash('bad');
    msg('<span class="dot out"></span><b>Clocked out</b> at ' + hhmm, 'ok');
    $('#result').innerHTML = '<span class="dot out"></span><b>Clocked out at ' + hhmm + '.</b>' + (shift ? ' Shift ' + shift + ' · ' : ' ') + (D.weekHours || 0).toFixed(1) + ' h this week.';
    setTimeout(close, 1800);
  }
}
function fail(text) { tone(false); flash('bad'); msg(esc(text), 'err'); $('#result').innerHTML = '<b>' + esc(text) + '</b>'; }

function punch(pin) {
  if (busy) return; busy = true;
  msg('Reading…', 'ok');
  if (isFiveM) {
    post('clock:punch', { method, pin }).then(res => {
      busy = false;
      if (!res || !res.ok) { if (method === 'keypad') showPin(true); return fail((res && res.msg) || 'The time clock didn\'t respond.'); }
      if (res.data) D = res.data;
      clockedAt = D.onDuty ? Date.now() - (D.shiftSeconds || 0) * 1000 : null;
      render(); done(res.onDuty, res.shift);
    });
    return;
  }
  setTimeout(() => { // demo
    let shift = null;
    if (!D.onDuty) { D.onDuty = true; clockedAt = Date.now() - 3000; }
    else {
      const mins = Math.max(1, Math.round((Date.now() - clockedAt) / 60000)) + 192, h = mins / 60;
      D.onDuty = false; D.weekHours += h; D.monthHours += h; D.week[D.today] += h; clockedAt = null;
      shift = Math.floor(h) + 'h ' + (mins % 60) + 'm'; D.lastShift = 'today · ' + shift;
    }
    busy = false; render(); done(D.onDuty, shift);
  }, 600);
}

// ---------- tap / swipe: drag the ID ----------
const card = $('#card'), stage = $('#stage');
let drag = null;
const resetCard = () => { card.style.left = ''; card.style.top = ''; $('#fill').style.width = '0'; };
card.addEventListener('pointerdown', e => {
  if (method === 'keypad' || busy) return;
  const r = card.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, s: stage.getBoundingClientRect(), startX: null, startT: 0 };
  card.setPointerCapture(e.pointerId); card.classList.add('drag');
});
card.addEventListener('pointermove', e => {
  if (!drag) return;
  // screen pixels -> the clock's own (unscaled) pixels
  const x = (e.clientX - drag.s.left - drag.dx) / S, y = (e.clientY - drag.s.top - drag.dy) / S;
  const sw = drag.s.width / S, sh = drag.s.height / S;
  card.style.left = Math.max(-60, Math.min(sw - 120, x)) + 'px'; card.style.top = Math.max(-40, Math.min(sh - 50, y)) + 'px';
  const cr = card.getBoundingClientRect();
  if (method === 'tap') {
    const pr = $('#pad').getBoundingClientRect();
    $('#pad').classList.toggle('hot', cr.right > pr.left + 50 && cr.left < pr.right - 50 && cr.bottom > pr.top + 40 && cr.top < pr.bottom - 40);
  } else if (method === 'swipe') {
    const sl = $('#slot').getBoundingClientRect();
    const inSlot = cr.bottom > sl.top + 8 && cr.top < sl.bottom - 8;
    if (inSlot && drag.startX === null) { drag.startX = cr.left; drag.startT = performance.now(); }
    if (!inSlot) { drag.startX = null; $('#fill').style.width = '0'; return; }
    const prog = (cr.left - drag.startX) / (sl.width * 0.45);
    $('#fill').style.width = Math.max(0, Math.min(1, prog)) * (sl.width / S - 28) + 'px';
    if (prog >= 1) {
      const ms = performance.now() - drag.startT; endDrag();
      if (ms < 900) punch(); else fail('Too slow. Try one quick move.');
    }
  }
});
function endDrag() {
  if (!drag) return;
  card.classList.remove('drag');
  if (method === 'tap' && $('#pad').classList.contains('hot')) { $('#pad').classList.add('read'); setTimeout(() => $('#pad').classList.remove('read', 'hot'), 800); punch(); }
  drag = null; setTimeout(resetCard, 250);
}
card.addEventListener('pointerup', endDrag); card.addEventListener('pointercancel', endDrag);

// ---------- keypad ----------
let pin = '';
function buildKeys() {
  const k = $('#keys'); k.innerHTML = '<div class="disp" id="pinDisp"></div>';
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Clear', '0', 'OK'].forEach(v => {
    const b = document.createElement('button'); b.textContent = v;
    if (v === 'OK') b.className = 'go'; if (v === 'Clear') b.className = 'clr';
    b.onclick = () => {
      if (busy) return;
      b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 140);
      if (v === 'Clear') pin = '';
      else if (v === 'OK') {
        const entered = pin; pin = '';
        if (isFiveM) punch(entered);                       // the server checks the PIN
        else if (entered === D.pin) punch(); else { fail('Wrong PIN. It\'s on your ID.'); showPin(true); }
      } else if (pin.length < 4) pin += v;
      showPin();
    };
    k.appendChild(b);
  });
  showPin();
}
/** PIN dots: typed ones glow (newest pops in); bad = red glow + shake */
function showPin(bad) {
  const d = $('#pinDisp'); if (!d) return;
  d.innerHTML = [0, 1, 2, 3].map(i => '<span class="d' + (i < pin.length ? ' on' : '') + (i === pin.length - 1 ? ' new' : '') + '">' + (i < pin.length ? '•' : '·') + '</span>').join('');
  d.classList.toggle('typing', pin.length > 0);
  if (bad) { d.classList.remove('bad'); void d.offsetWidth; d.classList.add('bad'); setTimeout(() => d.classList.remove('bad'), 700); }
}

// ---------- tap / swipe / PIN ----------
function setMethod(m) {
  method = m; stage.className = 'stage ' + m; resetCard(); pin = ''; buildKeys();
  msg(HINT[m]); $('#result').textContent = '';
  $('#seg').innerHTML = methods.length > 1 ? methods.map(x => '<button data-m="' + x + '" class="' + (x === m ? 'on' : '') + '">' + NAME[x] + '</button>').join('') : '';
  $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => setMethod(b.dataset.m));
}

// ---------- open / close ----------
function close() {
  $('#wrap').classList.remove('show');
  if (host && host.screenClosed) host.screenClosed('timeclock');
  post('clock:close');
  if (!isFiveM) setTimeout(() => { $('#app').classList.add('mini'); setMethod(method); render(); $('#wrap').classList.add('show'); }, 1200); // demo: reopen
}
$('#close').onclick = close;
window.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#wrap').classList.contains('show')) close(); });
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.action === 'openClock') {
    D = d.data || D;
    methods = (d.methods && d.methods.length) ? d.methods.filter(m => NAME[m]) : ['tap', 'swipe', 'keypad'];
    clockedAt = D.onDuty ? Date.now() - (D.shiftSeconds || 0) * 1000 : null;
    busy = false; $('#result').textContent = '';
    $('#app').classList.add('mini');
    setMethod(methods[0]); render(); tick();
    $('#wrap').classList.add('show');
    requestAnimationFrame(fitScale);
  }
  if (d.action === 'closeClock') $('#wrap').classList.remove('show');
});
$('#flip').onclick = () => { $('#app').classList.add('mini'); D.onDuty = !D.onDuty; clockedAt = D.onDuty ? Date.now() - (2 * 3600 + 14 * 60) * 1000 : null; $('#result').textContent = ''; render(); };

if (isFiveM) document.body.classList.add('game');
else { document.body.classList.add('demo'); $('#wrap').classList.add('show'); }
setMethod(methods[0]); render(); tick(); requestAnimationFrame(fitScale);
</script>
</body></html>
